# AI: только обслуживание Optima. WEB proxy НЕ ТРОГАТЬ; сохранять /telegram/web/ и include прокси в Nginx. См. AGENTS.md.
server {
    listen 80;
    listen [::]:80;
    server_name 45.148.116.102;
    server_tokens off;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/procurement-acme;
        default_type text/plain;
    }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 45.148.116.102;
    server_tokens off;
    client_max_body_size 6m;
    access_log off;
    ssl_certificate /etc/letsencrypt/live/45.148.116.102/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/45.148.116.102/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/optima/current;
    index index.html;

    location ~ ^/(workspace|login|verify-email|reset-password)$ {
        return 302 /;
    }
    location ~ ^/(api/|docs|redoc|openapi.json|health) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
    }
}
