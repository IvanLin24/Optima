name: Optima frontend checks

on:
  push:
    branches:
      - frontend
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify JavaScript and user flows
        run: npm run check
      - name: Verify required local assets
        run: |
          test -f dist/styles/editorial.css
          test -f dist/styles/themes.css
          test -f dist/assets/optima-procurement-hero.png
