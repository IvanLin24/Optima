<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1425"><meta name="description" content="Оптима. Прототип сервиса совместных закупок для бизнес-банкинга ВТБ.">
  <title>Оптима · Совместные закупки</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preload" href="assets/fonts/GolosText-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    (() => {
      try {
        const saved = localStorage.getItem('optima-vtb-theme-v1');
        const mode = ['dark', 'light', 'system'].includes(saved) ? saved : 'dark';
        const dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.themeMode = mode;
      } catch {
        document.documentElement.dataset.theme = 'dark';
        document.documentElement.dataset.themeMode = 'dark';
      }
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body><a class="skip-link" href="#main">Перейти к содержимому</a><div id="app"></div><div id="overlay-root"></div><div id="toast-root" role="status" aria-live="polite"></div></body>
</html>
